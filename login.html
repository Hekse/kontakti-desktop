<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">

<title>Kontakti — Kirjaudu</title>
<style>
:root{
  --bg0:#071226;--bg1:#091a35;--panel:rgba(255,255,255,.05);--stroke:rgba(255,255,255,.17);
  --text:rgba(255,255,255,.96);--muted:rgba(255,255,255,.68);
  --brand:#2d6bff;--brand2:#2153c8;--danger:#ff4d4d;
  --shadow:0 14px 40px rgba(0,0,0,.35);--r22:22px;
  --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--sans);color:var(--text);background:radial-gradient(1200px 700px at 18% 0%, rgba(45,107,255,.22), transparent 62%),radial-gradient(1000px 520px at 90% 10%, rgba(38,208,124,.10), transparent 65%),linear-gradient(180deg,var(--bg0),var(--bg1))}
.login-card{width:min(380px,100%);background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r22);box-shadow:var(--shadow);backdrop-filter:blur(6px);padding:28px 26px;display:flex;flex-direction:column;gap:20px}
.login-brand{display:flex;align-items:center;gap:12px}
.opero-logo-mini{width:44px;height:44px;flex:0 0 44px}
.opero-logo-img{display:block;width:100%;height:100%;object-fit:contain}
.title{font-size:26px;font-weight:700;line-height:1.02}
.brand-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.sub{font-size:12px;font-weight:400;color:var(--muted)}
.lang-switch{display:flex;align-items:center;gap:6px}
.lang-opt{appearance:none;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.14);color:var(--text);cursor:pointer;padding:3px 6px;border-radius:8px;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;opacity:.55;transition:.15s ease}
.lang-opt:hover{opacity:.85;background:rgba(255,255,255,.07)}
.lang-opt.active{opacity:1;background:rgba(45,107,255,.16);border-color:rgba(45,107,255,.6);box-shadow:0 0 0 1px rgba(45,107,255,.24),0 0 8px rgba(45,107,255,.30)}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:12px;color:var(--muted);font-weight:400}
input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:var(--text);border-radius:14px;padding:10px 12px;outline:none;font-weight:400;font-family:inherit;font-size:14px}
input:focus{border-color:rgba(45,107,255,.55)}
input::placeholder{color:var(--muted)}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{padding-right:42px;width:100%}
.pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px;border-radius:8px;line-height:1}
.pw-toggle:hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:var(--text);border-radius:12px;padding:11px 12px;cursor:pointer;font-weight:550;font-size:14px;transition:.15s ease}
.btn.primary{background:linear-gradient(180deg, rgba(45,107,255,.95), rgba(33,83,200,.95));border-color:rgba(45,107,255,.4);box-shadow:0 10px 18px rgba(45,107,255,.10);color:#fff}
.btn.primary:hover{background:linear-gradient(180deg, rgba(45,107,255,1), rgba(33,83,200,1))}
.btn:disabled{opacity:.6;cursor:not-allowed}
.login-status{font-size:13px;line-height:1.4;min-height:0;color:var(--danger)}
.login-status[hidden]{display:none}
.login-status.info{color:var(--muted)}
</style>
</head>

      <div>
        <div class="title">Kontakti</div>
        <div class="brand-row">
          <span class="sub" data-i18n="byOpero">by Opero</span>
          <div class="lang-switch" id="langSwitch">
            <button type="button" class="lang-opt" data-lang="fi" aria-label="Suomi">🇫🇮</button>
            <button type="button" class="lang-opt" data-lang="en" aria-label="English">🇬🇧</button>
          </div>
        </div>
      </div>

    <form id="loginForm">
      <div class="field">
        <label class="label" for="email" data-i18n="email">Sähköposti</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="label" for="password" data-i18n="password">Salasana</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="btnTogglePw" data-i18n-title="showPassword" aria-label="Näytä salasana" title="Näytä salasana">👁</button>
        </div>
      </div>
      <button type="submit" class="btn primary" id="btnSignIn" data-i18n="signIn">Kirjaudu</button>
      <div class="login-status" id="loginStatus" hidden></div>
    </form>
  </div>

<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://miahuckcphquawobehtk.supabase.co','sb_publishable_tY1y97VnFfhXyKJ_9XCNGw_-rEq2pLx');
const $=id=>document.getElementById(id);

// Sallittu poikkeus: localStoragea käytetään VAIN käyttöliittymän kieliasetukseen.
// Salasanaa ei koskaan tallenneta localStorageen tai mihinkään omaan storageen —
// se annetaan suoraan signInWithPassword-kutsulle, ja Supabase hallitsee sessionsa itse.
const LS_LANG='kontakti_v5_lang';
let LANG=(localStorage.getItem(LS_LANG)==='en')?'en':'fi';
const TRANSLATIONS={
  fi:{
    byOpero:'by Opero', email:'Sähköposti', password:'Salasana', signIn:'Kirjaudu', signingIn:'Kirjaudutaan...',
    signInFailed:'Kirjautuminen epäonnistui. Tarkista sähköposti ja salasana.',
    showPassword:'Näytä salasana', hidePassword:'Piilota salasana',
    fillBoth:'Täytä sähköposti ja salasana.'
  },
  en:{
    byOpero:'by Opero', email:'Email', password:'Password', signIn:'Sign in', signingIn:'Signing in...',
    signInFailed:'Sign in failed. Check your email and password.',
    showPassword:'Show password', hidePassword:'Hide password',
    fillBoth:'Enter your email and password.'
  }
};
function t(key){ return (TRANSLATIONS[LANG]&&TRANSLATIONS[LANG][key]) ?? TRANSLATIONS.fi[key] ?? key; }
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.getAttribute('data-i18n')); });
  const pwBtn=$('btnTogglePw');
  if(pwBtn){ const key=$('password').type==='password'?'showPassword':'hidePassword'; pwBtn.title=t(key); pwBtn.setAttribute('aria-label',t(key)); }
  document.documentElement.lang=LANG;
}
function updateLangSwitcherUI(){ document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG)); }
function setLang(lang){ LANG=(lang==='en')?'en':'fi'; localStorage.setItem(LS_LANG,LANG); applyStaticI18n(); updateLangSwitcherUI(); }
document.querySelectorAll('.lang-opt').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));
applyStaticI18n(); updateLangSwitcherUI();

$('btnTogglePw')?.addEventListener('click',()=>{
  const pw=$('password'); pw.type = pw.type==='password' ? 'text' : 'password';
  applyStaticI18n();
});

function setStatus(msg,cls){ const el=$('loginStatus'); if(!msg){ el.hidden=true; el.textContent=''; return; } el.hidden=false; el.className='login-status'+(cls?(' '+cls):''); el.textContent=msg; }

// Jos käyttäjällä on jo voimassa oleva Supabase-sessio (esim. toiselta Kontakti-sivulta),
// ohjataan suoraan sovellukseen sen sijaan että näytettäisiin login-lomake turhaan.
(async()=>{
  try{
    const r=await sb.auth.getUser();
    if(r.data?.user){ window.location.href='cloud-ui-v8.html'; }
  }catch(e){ /* ei sessiota / ei verkkoa -> jätetään login-lomake näkyviin */ }
})();

$('loginForm')?.addEventListener('submit', async(e)=>{
  e.preventDefault();
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){ setStatus(t('fillBoth')); return; }
  const btn=$('btnSignIn');
  btn.disabled=true; const oldLabel=btn.textContent; btn.textContent=t('signingIn');
  setStatus(t('signingIn'),'info');
  try{
    const r=await sb.auth.signInWithPassword({email,password});
    if(r.error){ setStatus(t('signInFailed')); btn.disabled=false; btn.textContent=oldLabel; return; }
    setStatus('');
    window.location.href='cloud-ui-v8.html';
  }catch(err){
    setStatus(t('signInFailed')); btn.disabled=false; btn.textContent=oldLabel;
  }
});
</script>
