<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontakti — Palauta salasana</title>
<style>
:root{
  --bg0:#050b1a;--bg1:#0a1830;
  --panel:rgba(255,255,255,.055);--stroke:rgba(255,255,255,.18);
  --text:rgba(255,255,255,.97);--muted:rgba(255,255,255,.62);
  --brand:#2d6bff;--brand2:#1c4fd6;--danger:#ff5a5a;--ok:#26d07c;
  --shadow:0 24px 60px rgba(0,0,0,.45);--r22:24px;
  --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  font-family:var(--sans);color:var(--text);
  background:
    radial-gradient(900px 620px at 16% 18%, rgba(45,107,255,.24), transparent 60%),
    radial-gradient(760px 580px at 88% 84%, rgba(130,92,246,.14), transparent 62%),
    radial-gradient(620px 420px at 82% 6%, rgba(45,210,220,.08), transparent 60%),
    linear-gradient(180deg,var(--bg0),var(--bg1));
}
.login-card{
  width:min(400px,100%);background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r22);
  box-shadow:var(--shadow),0 1px 0 rgba(255,255,255,.05) inset;backdrop-filter:blur(8px);
  padding:36px 34px;display:flex;flex-direction:column;gap:26px;
}
.login-brand{display:flex;align-items:center;gap:14px}
.opero-logo-mini{width:50px;height:50px;flex:0 0 50px}
.opero-logo-img{display:block;width:100%;height:100%;object-fit:contain}
.title{font-size:30px;font-weight:720;line-height:1.05;letter-spacing:-.01em}
.brand-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:3px}
.sub{font-size:12px;font-weight:400;color:var(--muted)}
.lang-switch{display:flex;align-items:center;gap:6px}
.lang-opt{appearance:none;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.15);color:var(--text);cursor:pointer;padding:3px 6px;border-radius:8px;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;opacity:.55;transition:.15s ease}
.lang-opt:hover{opacity:.85;background:rgba(255,255,255,.08)}
.lang-opt.active{opacity:1;background:rgba(45,107,255,.15);border-color:rgba(45,107,255,.55);box-shadow:0 0 0 1px rgba(45,107,255,.20),0 0 6px rgba(45,107,255,.22)}
.welcome{display:flex;flex-direction:column;gap:4px}
.welcome-title{font-size:17px;font-weight:620;color:var(--text);line-height:1.3}
.welcome-sub{font-size:13px;font-weight:400;color:var(--muted);line-height:1.4}
form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.label{font-size:12px;color:var(--muted);font-weight:450;letter-spacing:.01em}
input{
  width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.18);color:var(--text);
  border-radius:13px;padding:13px 14px;min-height:46px;outline:none;font-weight:400;font-family:inherit;font-size:14.5px;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
input:hover{border-color:rgba(255,255,255,.28)}
input:focus{border-color:rgba(45,107,255,.65);box-shadow:0 0 0 3px rgba(45,107,255,.16);background:rgba(255,255,255,.06)}
input::placeholder{color:var(--muted)}
.btn{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:var(--text);border-radius:13px;padding:13px 14px;min-height:46px;cursor:pointer;font-weight:600;font-size:14.5px;transition:.15s ease;display:inline-flex;align-items:center;justify-content:center;width:100%}
.btn.primary{background:linear-gradient(180deg, rgba(51,112,255,.98), rgba(31,79,214,.98));border-color:rgba(45,107,255,.5);box-shadow:0 12px 24px rgba(31,79,214,.22);color:#fff}
.btn.primary:hover{background:linear-gradient(180deg, rgba(63,122,255,1), rgba(38,90,224,1));box-shadow:0 14px 28px rgba(31,79,214,.28)}
.btn.primary:active{transform:translateY(1px);box-shadow:0 8px 16px rgba(31,79,214,.20)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.login-status{font-size:13px;line-height:1.4;min-height:0;color:var(--danger)}
.login-status[hidden]{display:none}
.login-status.info{color:var(--muted)}
.login-status.error-box{background:rgba(255,77,77,.10);border:1px solid rgba(255,77,77,.28);border-radius:10px;padding:9px 11px}
.login-status.success-box{background:rgba(38,208,124,.10);border:1px solid rgba(38,208,124,.30);border-radius:10px;padding:9px 11px;color:var(--text)}
.back-row{display:flex;justify-content:center}
.back-link{font-size:13px;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text);text-decoration:underline}
@media (max-width:480px){
  body{padding:16px}
  .login-card{padding:26px 22px;gap:22px;border-radius:20px}
  .title{font-size:26px}
}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="opero-logo-mini"><img class="opero-logo-img" alt="Opero" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiBhcmlhLWhpZGRlbj0idHJ1ZSI+PHBhdGggZD0iTTgzIDI5IEE0MCA0MCAwIDEgMCA4MyA3MSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDA5RUZGIiBzdHJva2Utd2lkdGg9IjEyIi8+PGNpcmNsZSBjeD0iNTAiIGN5PSI1MCIgcj0iMjIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzAwOUVGRiIgc3Ryb2tlLXdpZHRoPSIxMSIvPjwvc3ZnPg=="></div>
      <div>
        <div class="title">Kontakti</div>
        <div class="brand-row">
          <span class="sub" data-i18n="byOpero">by Opero</span>
          <div class="lang-switch" id="langSwitch">
            <button type="button" class="lang-opt" data-lang="fi" aria-label="Suomi">🇫🇮</button>
            <button type="button" class="lang-opt" data-lang="en" aria-label="English">🇬🇧</button>
          </div>
        </div>
      </div>
    </div>
    <div class="welcome">
      <div class="welcome-title" data-i18n="resetTitle">Palauta salasana</div>
      <div class="welcome-sub" data-i18n="resetSub">Syötä tilisi sähköpostiosoite. Lähetämme sinulle linkin salasanan vaihtamista varten.</div>
    </div>
    <form id="resetForm">
      <div class="field">
        <label class="label" for="email" data-i18n="email">Sähköposti</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <button type="submit" class="btn primary" id="btnSend" data-i18n="sendResetLink">Lähetä palautuslinkki</button>
      <div class="login-status" id="resetStatus" hidden></div>
    </form>
    <div class="back-row"><a href="login.html" class="back-link" data-i18n="backToSignIn">Takaisin kirjautumiseen</a></div>
  </div>

<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.117.2';
const sb=createClient('https://miahuckcphquawobehtk.supabase.co','sb_publishable_tY1y97VnFfhXyKJ_9XCNGw_-rEq2pLx');
const $=id=>document.getElementById(id);

// Tuotannon GitHub Pages -osoite kovakoodattuna — ei localhostia. Tämä URL PITÄÄ myös olla
// hyväksytty Supabase-projektin Authentication → URL Configuration → Redirect URLs -listalla,
// muuten Supabase ei ohjaa käyttäjää tänne palautuslinkistä.
const UPDATE_PASSWORD_URL=new URL('./update-password.html',window.location.href).href;

// Sallittu poikkeus: localStoragea käytetään VAIN käyttöliittymän kieliasetukseen.
const LS_LANG='kontakti_v5_lang';
let LANG=(localStorage.getItem(LS_LANG)==='en')?'en':'fi';
const TRANSLATIONS={
  fi:{
    byOpero:'by Opero',
    resetTitle:'Palauta salasana',
    resetSub:'Syötä tilisi sähköpostiosoite. Lähetämme sinulle linkin salasanan vaihtamista varten.',
    email:'Sähköposti',
    sendResetLink:'Lähetä palautuslinkki', sending:'Lähetetään...',
    backToSignIn:'Takaisin kirjautumiseen',
    emailRequired:'Täytä sähköpostiosoite.',
    neutralMessage:'Jos sähköpostiosoite kuuluu käyttäjätilille, lähetimme salasanan palautuslinkin.',
    tooManyRequests:'Liian monta pyyntöä. Odota hetki ja yritä uudelleen.'
  },
  en:{
    byOpero:'by Opero',
    resetTitle:'Reset password',
    resetSub:"Enter your account email address. We'll send you a link to reset your password.",
    email:'Email',
    sendResetLink:'Send reset link', sending:'Sending...',
    backToSignIn:'Back to sign in',
    emailRequired:'Enter your email address.',
    neutralMessage:'If an account exists for this email address, we sent a password reset link.',
    tooManyRequests:'Too many requests. Please wait a moment and try again.'
  }
};
function t(key){ return (TRANSLATIONS[LANG]&&TRANSLATIONS[LANG][key]) ?? TRANSLATIONS.fi[key] ?? key; }
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.getAttribute('data-i18n')); });
  document.documentElement.lang=LANG;
}
function updateLangSwitcherUI(){ document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG)); }
function setLang(lang){ LANG=(lang==='en')?'en':'fi'; localStorage.setItem(LS_LANG,LANG); applyStaticI18n(); updateLangSwitcherUI(); }
document.querySelectorAll('.lang-opt').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));
applyStaticI18n(); updateLangSwitcherUI();

function setStatus(msg,cls){
  const el=$('resetStatus');
  if(!msg){ el.hidden=true; el.textContent=''; el.className='login-status'; return; }
  el.hidden=false;
  el.className='login-status'+(cls==='info'?' info':cls==='success'?' success-box':' error-box');
  el.textContent=msg;
}
function isRateLimited(error){
  if(!error) return false;
  if(error.status===429) return true;
  const msg=(error.message||'').toLowerCase();
  return msg.includes('rate limit')||msg.includes('too many requests');
}

let submitting=false;
$('resetForm')?.addEventListener('submit', async(e)=>{
  e.preventDefault();
  if(submitting) return;
  const email=$('email').value.trim();
  if(!email){ setStatus(t('emailRequired')); return; }
  submitting=true;
  const btn=$('btnSend');
  btn.disabled=true; const oldLabel=btn.textContent; btn.textContent=t('sending');
  setStatus(t('sending'),'info');
  try{
    const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:UPDATE_PASSWORD_URL});
    // Tietoturva: emme koskaan paljasta onko sähköpostilla tiliä. Ainoa poikkeus on
    // rate-limit-virhe, joka ei paljasta mitään tilin olemassaolosta.
    if(r.error && isRateLimited(r.error)){
      setStatus(t('tooManyRequests'));
    } else {
      setStatus(t('neutralMessage'),'success');
      $('email').value='';
    }
  }catch(err){
    if(isRateLimited(err)) setStatus(t('tooManyRequests'));
    else setStatus(t('neutralMessage'),'success');
  }
  setTimeout(()=>{ btn.disabled=false; btn.textContent=oldLabel; submitting=false; },1200);
});
</script>
</body>
</html>
